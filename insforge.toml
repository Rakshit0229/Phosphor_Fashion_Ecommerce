[auth]
allowed_redirect_urls = ["http://localhost:5173/auth/callback", "https://d6hs9uen.insforge.site/auth/callback"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[auth.oauth.google]
enabled = true
client_id = ""
client_secret = ""

[auth.oauth.github]
enabled = true
client_id = ""
client_secret = ""
